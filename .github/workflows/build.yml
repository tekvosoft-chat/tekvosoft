name: Compilar e publicar as imagens

# Toda vez que você faz push na main, o GitHub compila as duas imagens
# e publica no GHCR da SUA organização. No servidor, ./tekvosoft update
# só baixa o resultado — nada é compilado em produção.
#
# Para lançar uma versão fixa (com rollback fácil):
#     git tag v1.0.0 && git push --tags

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
    # Nada aqui entra nas imagens. Como o build multi-arch (amd64 + arm64)
    # é demorado, não vale dispará-lo para mudança de documentação ou de
    # configuração. Use "Run workflow" na aba Actions se precisar forçar.
    paths-ignore:
      - "**.md"
      - "docker-compose*.yml"
      - ".env.example"
      - ".gitignore"
      - "tekvosoft"
      - "scripts/**"
      - ".vscode/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # precisamos das tags para gerar a versão exibida no app

      - name: Gerar informações de versão
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          COMMIT_AT=$(date -u -d "$(git log -1 --format=%cI)" +'%Y-%m-%dT%H:%M:%SZ')
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          BUILT_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          cat > backend/src/gitinfo.ts <<EOF
          export const GitInfo = {
              commitHash: "${COMMIT}",
              commitTimestamp: "${COMMIT_AT}",
              branchName: "${BRANCH}",
              tagName: "${TAG}",
              buildTimestamp: "${BUILT_AT}"
          };
          EOF

          cat > frontend/public/gitinfo.json <<EOF
          {
              "commitHash": "${COMMIT}",
              "commitTimestamp": "${COMMIT_AT}",
              "branchName": "${BRANCH}",
              "tagName": "${TAG}",
              "buildTimestamp": "${BUILT_AT}"
          }
          EOF

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Entrar no registro de imagens
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nome e tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          # publica na organização dona deste repositório, seja ela qual for
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/tekvosoft-${{ matrix.component }}
          # Convenção de tags:
          #   main    último build da branch main — pode conter trabalho em andamento
          #   1.2.3   release exata, imutável, é nela que produção deve ficar
          #   1.2 / 1 acompanham correções dentro da mesma minor/major
          #   latest  aponta para a ÚLTIMA RELEASE, nunca para a main
          #
          # "latest" sair de tag e não da main é o que impede um commit
          # qualquer de ir para produção no próximo ./tekvosoft update.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=tekvosoft-${{ matrix.component }}

      - name: Compilar e publicar
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          target: prod
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # Publica a release no GitHub quando uma tag v*.*.* é enviada.
  # As notas saem do CHANGELOG.md; se a versão não estiver lá, caem para a
  # lista de commits desde a tag anterior.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Montar as notas da versão
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NUM="${VERSION#v}"
          NOTES_FILE=$(mktemp)

          # Tenta extrair a seção desta versão do CHANGELOG
          if [ -f CHANGELOG.md ]; then
            awk -v v="## ${NUM}" '
              $0 ~ "^" v " " || $0 == v { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "${NOTES_FILE}"
          fi

          if [ ! -s "${NOTES_FILE}" ]; then
            PREV=$(git tag -l 'v*.*.*' --sort=-v:refname | grep -v "^${VERSION}$" | head -1)
            echo "### Alterações" >> "${NOTES_FILE}"
            echo "" >> "${NOTES_FILE}"
            if [ -n "${PREV}" ]; then
              git log --no-merges --pretty='- %s' "${PREV}..${VERSION}" >> "${NOTES_FILE}"
            else
              git log --no-merges --pretty='- %s' -20 >> "${NOTES_FILE}"
            fi
          fi

          cat >> "${NOTES_FILE}" <<EOF

          ---

          ### Como atualizar

          \`\`\`bash
          curl -sSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/update.sh | sudo bash
          \`\`\`

          Para fixar exatamente esta versão, use \`TAG=${NUM}\` no \`.env\`.
          EOF

          echo "file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${{ steps.notes.outputs.file }}" \
            --verify-tag
