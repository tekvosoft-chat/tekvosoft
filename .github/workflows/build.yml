name: Compilar e publicar as imagens

# Todo push na main vira uma versão nova automaticamente: o job "versao"
# calcula o próximo número, cria a tag e entrega para os demais jobs.
#
# Por que a tag é criada AQUI dentro, e não por um passo solto que depois
# dispara outro workflow: o GitHub, de propósito, não dispara workflow para
# eventos criados com o GITHUB_TOKEN — é a proteção contra loop infinito.
# Uma tag criada assim nunca iniciaria a compilação. Fazendo tudo na mesma
# execução, a versão sai publicada sem depender de segundo disparo e sem
# precisar de token pessoal.
#
# Para pular a versão num commit (ex.: ajuste de texto), escreva
# [sem versao] na mensagem do commit.
#
# Para uma versão maior, continue usando ./tekvosoft release minor|major —
# ele escreve o CHANGELOG e envia a tag pronta.

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
    # Nada aqui entra nas imagens. Como o build multi-arch (amd64 + arm64)
    # é demorado, não vale dispará-lo para mudança de documentação ou de
    # configuração. Use "Run workflow" na aba Actions se precisar forçar.
    paths-ignore:
      - "**.md"
      - "docker-compose*.yml"
      - ".env.example"
      - ".gitignore"
      - "tekvosoft"
      - "scripts/**"
      - ".vscode/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Decide qual versão este build carrega.
  #   - push de tag feita à mão  -> usa ela
  #   - push na main             -> calcula a próxima correção e cria a tag
  #   - qualquer outro caso      -> build sem versão (só a tag da branch)
  versao:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      lancar: ${{ steps.calc.outputs.lancar }}
      versao: ${{ steps.calc.outputs.versao }}
      tag: ${{ steps.calc.outputs.tag }}
      maiormenor: ${{ steps.calc.outputs.maiormenor }}
      maior: ${{ steps.calc.outputs.maior }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular a versão
        id: calc
        run: |
          set -euo pipefail
          publicar() {
            echo "lancar=true"                 >> "$GITHUB_OUTPUT"
            echo "versao=$1"                   >> "$GITHUB_OUTPUT"
            echo "tag=v$1"                     >> "$GITHUB_OUTPUT"
            echo "maiormenor=${1%.*}"          >> "$GITHUB_OUTPUT"
            echo "maior=${1%%.*}"              >> "$GITHUB_OUTPUT"
            echo "Versão desta execução: $1"
          }
          pular() {
            echo "lancar=false" >> "$GITHUB_OUTPUT"
            echo "Sem versão nesta execução: $1"
          }

          # Tag enviada à mão (./tekvosoft release minor|major)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            publicar "${GITHUB_REF_NAME#v}"
            exit 0
          fi

          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            pular "versões saem apenas da main"
            exit 0
          fi

          # Release manual envia main e tag juntos e o GitHub dispara DUAS
          # execuções. Quem publica é a da tag; esta aqui sai de fininho,
          # senão sairiam duas versões para o mesmo commit.
          if git tag --points-at HEAD | grep -q '^v[0-9]'; then
            pular "este commit já tem tag"
            exit 0
          fi

          if git log -1 --pretty=%B | grep -qiE '\[sem versao\]|\[skip release\]'; then
            pular "pedido pela mensagem do commit"
            exit 0
          fi

          ANTERIOR=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "${ANTERIOR}" ]; then
            NOVA="1.0.0"
          else
            IFS=. read -r MA ME CO <<< "${ANTERIOR#v}"
            NOVA="${MA}.${ME}.$((CO + 1))"
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${NOVA}" -m "Versão ${NOVA}"
          git push origin "v${NOVA}"
          publicar "${NOVA}"

  build:
    needs: versao
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # precisamos das tags para gerar a versão exibida no app

      - name: Gerar informações de versão
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          COMMIT_AT=$(date -u -d "$(git log -1 --format=%cI)" +'%Y-%m-%dT%H:%M:%SZ')
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          # Versão vinda do job "versao"; vazio em build sem release.
          TAG="${{ needs.versao.outputs.tag }}"
          BUILT_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          # título do commit, para o aviso de novidade no app (sem aspas/barras)
          COMMIT_MSG=$(git log -1 --format=%s | tr -d '"\\' | cut -c1-140)

          cat > backend/src/gitinfo.ts <<EOF
          export const GitInfo = {
              commitHash: "${COMMIT}",
              commitTimestamp: "${COMMIT_AT}",
              branchName: "${BRANCH}",
              tagName: "${TAG}",
              buildTimestamp: "${BUILT_AT}"
          };
          EOF

          cat > frontend/public/gitinfo.json <<EOF
          {
              "commitHash": "${COMMIT}",
              "commitTimestamp": "${COMMIT_AT}",
              "branchName": "${BRANCH}",
              "tagName": "${TAG}",
              "buildTimestamp": "${BUILT_AT}",
              "commitMessage": "${COMMIT_MSG}"
          }
          EOF

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Entrar no registro de imagens
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nome e tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          # publica na organização dona deste repositório, seja ela qual for
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/tekvosoft-${{ matrix.component }}
          # Convenção de tags:
          #   main    último build da branch main — pode conter trabalho em andamento
          #   1.2.3   release exata, imutável, é nela que produção deve ficar
          #   1.2 / 1 acompanham correções dentro da mesma minor/major
          #   latest  aponta para a ÚLTIMA RELEASE, nunca para a main
          #
          # "latest" sair de tag e não da main é o que impede um commit
          # qualquer de ir para produção no próximo ./tekvosoft update.
          tags: |
            type=ref,event=branch
            type=raw,value=${{ needs.versao.outputs.versao }},enable=${{ needs.versao.outputs.lancar == 'true' }}
            type=raw,value=${{ needs.versao.outputs.maiormenor }},enable=${{ needs.versao.outputs.lancar == 'true' }}
            type=raw,value=${{ needs.versao.outputs.maior }},enable=${{ needs.versao.outputs.lancar == 'true' }}
            type=raw,value=latest,enable=${{ needs.versao.outputs.lancar == 'true' }}
          labels: |
            org.opencontainers.image.title=tekvosoft-${{ matrix.component }}

      - name: Compilar e publicar
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          target: prod
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # Publica a release no GitHub quando uma tag v*.*.* é enviada.
  # As notas saem do CHANGELOG.md; se a versão não estiver lá, caem para a
  # lista de commits desde a tag anterior.
  release:
    needs: [versao, build]
    if: needs.versao.outputs.lancar == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Montar as notas da versão
        id: notes
        run: |
          VERSION="${{ needs.versao.outputs.tag }}"
          NUM="${VERSION#v}"
          NOTES_FILE=$(mktemp)

          # Tenta extrair a seção desta versão do CHANGELOG
          if [ -f CHANGELOG.md ]; then
            awk -v v="## ${NUM}" '
              $0 ~ "^" v " " || $0 == v { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "${NOTES_FILE}"
          fi

          if [ ! -s "${NOTES_FILE}" ]; then
            PREV=$(git tag -l 'v*.*.*' --sort=-v:refname | grep -v "^${VERSION}$" | head -1)
            echo "### Alterações" >> "${NOTES_FILE}"
            echo "" >> "${NOTES_FILE}"
            if [ -n "${PREV}" ]; then
              git log --no-merges --pretty='- %s' "${PREV}..${VERSION}" >> "${NOTES_FILE}"
            else
              git log --no-merges --pretty='- %s' -20 >> "${NOTES_FILE}"
            fi
          fi

          cat >> "${NOTES_FILE}" <<EOF

          ---

          ### Como atualizar

          \`\`\`bash
          curl -sSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/update.sh | sudo bash
          \`\`\`

          Para fixar exatamente esta versão, use \`TAG=${NUM}\` no \`.env\`.
          EOF

          echo "file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.versao.outputs.tag }}" \
            --title "${{ needs.versao.outputs.tag }}" \
            --notes-file "${{ steps.notes.outputs.file }}" \
            --verify-tag
