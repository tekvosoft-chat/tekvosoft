# Override de DESENVOLVIMENTO.
# Compila a partir do código local e recarrega sozinho quando você salva.
#
#   ./tekvosoft dev
#
# Portas no host:
#   3000 -> frontend (dev server do React, com hot reload)
#   8080 -> backend  (API, reinicia sozinho a cada save)
#   5432 -> postgres
#   6379 -> redis
#   9229 -> debugger do Node (attach pelo VSCode)

services:
  postgres:
    ports:
      - "${DB_PORT_HOST:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"

  backend:
    build:
      context: ./backend
      target: dev
    # variante que expõe o debugger em 0.0.0.0 — dentro de container
    # o --inspect padrão só escuta em 127.0.0.1 e fica inalcançável
    command: ["npm", "run", "dev:server:docker"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      PORT: 3000
      BACKEND_URL: http://localhost:${API_PORT:-8080}
      FRONTEND_URL: http://localhost:${PORT:-3000}
    volumes:
      # código do host -> hot reload
      - ./backend:/usr/src/app
      # Artefatos de build ficam em volumes, não no host. O container roda
      # como root; se estes caírem na sua pasta, viram arquivos que você
      # não consegue apagar nem sobrescrever sem sudo.
      - backend_node_modules:/usr/src/app/node_modules
      - backend_dist:/usr/src/app/dist
      - backend_generated:/usr/src/app/src/generated
    ports:
      - "${API_PORT:-8080}:3000"
      - "${DEBUG_PORT:-9229}:9229"

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      # O endereço do backend NÃO vem daqui: o app lê public/config.json,
      # que o ./tekvosoft dev gera no host com a porta já resolvida.
      # o watcher precisa de polling para enxergar alterações em volume montado
      CHOKIDAR_USEPOLLING: "true"
      BROWSER: none
    volumes:
      - ./frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    ports:
      - "${PORT:-3000}:3000"

volumes:
  backend_node_modules:
  backend_dist:
  backend_generated:
  frontend_node_modules:
