# Override de DESENVOLVIMENTO.
# Compila a partir do código local e recarrega sozinho quando você salva.
#
#   ./tekvosoft dev
#
# Portas no host:
#   3000 -> frontend (dev server do React, com hot reload)
#   8080 -> backend  (API, reinicia sozinho a cada save)
#   5432 -> postgres
#   6379 -> redis
#   9229 -> debugger do Node (attach pelo VSCode)

services:
  postgres:
    ports:
      - "${DB_PORT_HOST:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"

  backend:
    build:
      context: ./backend
      target: dev
    # variante que expõe o debugger em 0.0.0.0 — dentro de container
    # o --inspect padrão só escuta em 127.0.0.1 e fica inalcançável
    command: ["npm", "run", "dev:server:docker"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      # o ts-node-dev só percebe o arquivo salvo com polling quando o código
      # vem do Windows ou do Mac (o Docker não repassa o aviso de mudança)
      CHOKIDAR_USEPOLLING: "true"
      PORT: 3000
      BACKEND_URL: http://localhost:${API_PORT:-8080}
      FRONTEND_URL: http://localhost:${PORT:-3000}
      # pipeline de IA lê o repositório daqui quando não há GitHub com token
      # configurado (o resultado vira patch; nenhum PR é aberto)
      DEV_PIPELINE_REPO_PATH: /repo
    volumes:
      # código do host -> hot reload
      - ./backend:/usr/src/app
      # o repositório inteiro, só leitura, para o pipeline de IA
      - .:/repo:ro
      # Artefatos de build ficam em volumes, não no host. O container roda
      # como root; se estes caírem na sua pasta, viram arquivos que você
      # não consegue apagar nem sobrescrever sem sudo.
      - backend_node_modules:/usr/src/app/node_modules
      - backend_dist:/usr/src/app/dist
      - backend_generated:/usr/src/app/src/generated
    ports:
      - "${API_PORT:-8080}:3000"
      - "${DEBUG_PORT:-9229}:9229"

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      # O endereço do backend NÃO vem daqui: o app lê public/config.json,
      # que o ./tekvosoft dev gera no host com a porta já resolvida.
      # o watcher precisa de polling para enxergar alterações em volume montado
      # (Windows e Mac não avisam o container). CHOKIDAR vale para o servidor
      # de desenvolvimento; WATCHPACK, para o webpack 5 que compila o código
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      BROWSER: none
      # o hot reload do navegador precisa da porta publicada no host, não da
      # 3000 de dentro do container. Quando o ./tekvosoft dev troca a porta
      # (3000 ocupada), sem isto a aba nunca recebe as atualizações: fica com
      # o bundle velho e quebra ao abrir uma tela carregada sob demanda
      WDS_SOCKET_PORT: ${PORT:-3000}
    volumes:
      - ./frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    ports:
      - "${PORT:-3000}:3000"

  browser:
    # Em dev o sistema fica em localhost:3000 e a API em localhost:8080, como
    # no seu navegador. Dentro deste container "localhost" é ele mesmo: um
    # repasse leva essas duas portas ao frontend e ao backend, e o navegador
    # de teste enxerga o sistema igual a você (mesmos cookies e websocket).
    command:
      - sh
      - -c
      - >-
        node -e "const net=require('net');[[${PORT:-3000},'frontend',3000],[${API_PORT:-8080},'backend',3000]].forEach(([port,host,to])=>net.createServer(c=>{const u=net.connect(to,host);c.pipe(u).pipe(c);c.on('error',()=>u.destroy());u.on('error',()=>c.destroy())}).listen(port,'127.0.0.1'))" &
        exec npx -y playwright@1.63.0 run-server --port 39321 --host 0.0.0.0

volumes:
  backend_node_modules:
  backend_dist:
  backend_generated:
  frontend_node_modules:
