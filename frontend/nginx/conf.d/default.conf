client_max_body_size 64m;

# SEGURANÇA — arquivos enviados (muitos vêm de clientes no WhatsApp).
# HTML/SVG/XML abertos no navegador rodariam script no domínio do sistema e
# roubariam a sessão do atendente. Só mídia/PDF/texto abre na tela
# (?inline=1); o resto sempre baixa e vai com "sandbox" (sem script).
map $uri $tkv_public_safe {
    ~*\.(pdf|png|jpe?g|gif|webp|bmp|ico|mp4|webm|ogg|oga|opus|mp3|m4a|aac|wav|txt)$ 1;
    default 0;
}
map "$tkv_public_safe:$arg_inline" $tkv_public_disposition {
    "1:1" inline;
    default attachment;
}
map $tkv_public_safe $tkv_public_csp {
    1 "";
    default "sandbox; default-src 'none'";
}

server {
    index index.html;
    root /var/www/public/;

    server_name _;

    include include.d/realip.conf;

    include sites.d/frontend.conf;
}
