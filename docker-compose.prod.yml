# Override de PRODUÇÃO.
# Usa as imagens já compiladas pelo GitHub Actions e publica na internet
# com HTTPS automático (Let's Encrypt), sem você tocar em certificado.
#
#   ./tekvosoft deploy    -> primeira subida
#   ./tekvosoft update    -> atualiza para a última versão
#
# Só as portas 80 e 443 ficam abertas. Postgres, Redis e o backend
# permanecem na rede interna, inacessíveis de fora.

volumes:
  ngx_conf:
  ngx_vhost:
  ngx_html:
  ngx_dhparam:
  ngx_certs:
  ngx_acme:

networks:
  web:

services:
  proxy:
    image: nginxproxy/nginx-proxy
    container_name: tekvosoft-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ngx_conf:/etc/nginx/conf.d
      - ngx_vhost:/etc/nginx/vhost.d
      - ngx_html:/usr/share/nginx/html
      - ngx_dhparam:/etc/nginx/dhparam
      - ngx_certs:/etc/nginx/certs:ro
      - ./confs/nginx-tekvosoft.conf:/etc/nginx/conf.d/tekvosoft.conf:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks: [web]

  certs:
    image: nginxproxy/acme-companion
    container_name: tekvosoft-certs
    restart: always
    depends_on:
      - proxy
    environment:
      NGINX_PROXY_CONTAINER: tekvosoft-proxy
      DEFAULT_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ngx_vhost:/etc/nginx/vhost.d
      - ngx_html:/usr/share/nginx/html
      - ngx_dhparam:/etc/nginx/dhparam:ro
      - ngx_certs:/etc/nginx/certs
      - ngx_acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [web]

  backend:
    image: ${REGISTRY:-ghcr.io/tekvosoft-chat}/tekvosoft-backend:${TAG:-latest}
    environment:
      NODE_ENV: production
      BACKEND_URL: https://${DOMAIN}/backend
      FRONTEND_URL: https://${DOMAIN}
    networks: [tekvosoft]

  frontend:
    image: ${REGISTRY:-ghcr.io/tekvosoft-chat}/tekvosoft-frontend:${TAG:-latest}
    environment:
      # lidas pelo proxy para rotear e emitir o certificado deste domínio
      VIRTUAL_HOST: ${DOMAIN}
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${ADMIN_EMAIL}
    depends_on:
      - certs
      - backend
    networks: [tekvosoft, web]
